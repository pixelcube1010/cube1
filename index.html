<title>오행 궁합소</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="생일과 MBTI로 나의 천간 카드를 뽑고 친구와 천생연분 점수를 재는 무료 궁합 테스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Jua&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f4eefb;--bg2:#eaf1fc;--bg3:#fdeef4;--surface:#fff;--fg:#33294a;--muted:#8a82a0;--line:#ece5f6;--accent:#a071e0;--accent2:#ff8fb8;
  --sans:"Noto Sans KR",system-ui,sans-serif;--serif:"Gowun Batang",serif;--round:"Jua",sans-serif;--head:"Black Han Sans",sans-serif;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161320;--bg2:#141a26;--bg3:#1e1522;--surface:#221f30;--fg:#efeaf7;--muted:#9990ad;--line:#332c44;--accent:#b791f2;--accent2:#ff9cc0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161320;--bg2:#141a26;--bg3:#1e1522;--surface:#221f30;--fg:#efeaf7;--muted:#9990ad;--line:#332c44;--accent:#b791f2;--accent2:#ff9cc0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:var(--sans);line-height:1.6;
  background:
    radial-gradient(1200px 500px at 15% -8%,rgba(255,150,200,.28),transparent 60%),
    radial-gradient(1000px 460px at 92% 8%,rgba(140,190,255,.26),transparent 60%),
    radial-gradient(900px 500px at 50% 118%,rgba(180,150,255,.24),transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg2) 52%,var(--bg3));
  background-attachment:fixed;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:26px 16px 60px}
.theme-btn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:var(--surface);border:1px solid var(--line);color:var(--fg);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px;box-shadow:0 4px 12px rgba(80,50,120,.12)}
.head{text-align:center;margin-bottom:20px}
.head .badge{display:inline-block;font-family:var(--round);font-size:11.5px;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));padding:4px 13px;border-radius:20px;letter-spacing:.04em;box-shadow:0 4px 14px rgba(160,110,220,.35);margin-bottom:10px}
.head h1{font-family:var(--round);font-size:31px;margin:0 0 6px;letter-spacing:.02em;
  background:linear-gradient(90deg,#a071e0,#ff8fb8 60%,#ffb15c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 10px rgba(160,110,220,.14)}
.head p{margin:0;color:var(--muted);font-size:13px}

.card-ui{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 22px;box-shadow:0 2px 8px rgba(60,40,90,.06),0 16px 40px rgba(90,60,140,.12);margin-bottom:18px;overflow:hidden}
.card-ui::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#8fd6a0,#ffd36b,#ff9ab0,#a99cf0,#8fc4f0);background-size:220% 100%;animation:sheen 5s linear infinite}
@keyframes sheen{0%{background-position:0% 0}100%{background-position:220% 0}}
label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
label .em{color:var(--accent);margin-right:4px}
input,select{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--fg);border-radius:14px;padding:13px 14px;font-family:var(--sans);font-size:15px;margin-bottom:17px;transition:border-color .15s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(160,113,224,.16)}
.seg{display:flex;gap:8px;margin-bottom:17px}
.seg button{flex:1;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;color:var(--muted);padding:13px;cursor:pointer;font-family:var(--sans);font-size:15px;font-weight:700;transition:.12s}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,#9b6ae4,#7d5fe0);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(130,90,220,.3)}
.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.mbti-grid button{background:var(--bg);border:1.5px solid var(--line);color:var(--fg);border-radius:12px;padding:11px 4px;cursor:pointer;font-family:var(--round);font-size:13px;transition:.12s}
.mbti-grid button:hover{border-color:var(--accent)}
.mbti-grid button[aria-pressed="true"]{background:linear-gradient(135deg,#9b6ae4,#7d5fe0);color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:0 6px 14px rgba(130,90,220,.32)}
.go{width:100%;color:#fff;border:0;border-radius:18px;padding:17px;font-family:var(--round);font-size:18px;cursor:pointer;background:linear-gradient(135deg,#9b6ae4,#7d5fe0);box-shadow:0 10px 24px rgba(130,90,220,.38);transition:transform .1s,box-shadow .1s;letter-spacing:.02em}
.go:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(130,90,220,.48)}
.go:active{transform:translateY(0)}
.friendbn{background:linear-gradient(135deg,rgba(255,143,184,.14),rgba(160,113,224,.14));border:1.5px dashed var(--accent2);border-radius:16px;padding:14px;margin-bottom:18px;font-size:13.5px;text-align:center;line-height:1.6}
.friendbn b{color:var(--accent)}

/* ===== 카드 ===== */
.result{display:none}.result.show{display:block;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.card{position:relative;width:100%;max-width:280px;margin:0 auto 4px;border-radius:5.5%;overflow:hidden;filter:drop-shadow(0 10px 26px rgba(120,70,160,.3))}
.card .bg{position:absolute;inset:0;z-index:0}
.card .frame{display:block;width:100%;height:auto;position:relative;z-index:3;pointer-events:none}
.card .char{position:absolute;z-index:5;left:15%;right:15%;top:34%;height:36%;display:flex;align-items:center;justify-content:center}
.card .char img{max-width:72%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.18))}
.card .holo{position:absolute;z-index:6;left:15.5%;right:15.5%;top:13%;height:57%;border-radius:48%;mix-blend-mode:screen;opacity:.38;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,150,210,.7) 46%,rgba(150,220,255,.7) 54%,transparent 66%);background-size:250% 250%;animation:holo 3.6s linear infinite}
@keyframes holo{0%{background-position:0% 0%}100%{background-position:250% 250%}}
.card .rare{position:absolute;z-index:7;top:75%;left:50%;transform:translateX(-50%);font-family:var(--head);font-size:10px;color:#fff;padding:2px 10px;border-radius:10px;white-space:nowrap}
.card .nick{position:absolute;z-index:7;bottom:12%;left:50%;transform:translateX(-50%);width:80%;text-align:center;font-family:var(--round);font-size:17px;line-height:1;white-space:nowrap}
.clab{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px}
.combohdr{text-align:center;margin-bottom:14px}
.combohdr .full{font-family:var(--round);font-size:21px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.combohdr .combo{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.axis{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.8}
.axis b{color:var(--accent)}
.statbar{display:flex;gap:7px;max-width:280px;margin:9px auto 0}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:8px 2px;text-align:center;box-shadow:0 3px 11px rgba(90,60,140,.07)}
.stat span{display:block;font-size:9.5px;color:var(--muted);font-weight:700;margin-bottom:1px}
.stat b{font-family:var(--round);font-size:18px;color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px;margin:12px auto 4px}
.tags span{font-family:var(--round);font-size:12px;color:var(--accent);background:linear-gradient(135deg,rgba(155,106,228,.12),rgba(255,143,184,.12));border:1px solid var(--line);padding:5px 11px;border-radius:20px}

.punch{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 16px 20px;margin-bottom:14px;font-size:14.5px;line-height:1.75;box-shadow:0 6px 18px rgba(90,60,140,.08)}
.punch::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:linear-gradient(var(--accent),var(--accent2))}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:14px;box-shadow:0 4px 14px rgba(90,60,140,.06)}
.sec b{font-size:12.5px;color:var(--accent);display:block;margin-bottom:4px}
.sec.sw{display:flex;gap:12px}.sec.sw>div{flex:1;min-width:0}

.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.tools button{flex:1;min-width:120px;background:var(--surface);border:1.5px solid var(--line);color:var(--fg);border-radius:14px;padding:14px;font-family:var(--round);font-size:14.5px;cursor:pointer;transition:.12s}
.tools button:hover{border-color:var(--accent)}
.tools button.primary{background:linear-gradient(135deg,#9b6ae4,#7d5fe0);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(130,90,220,.32)}

/* 궁합 */
.score-big{text-align:center;padding:22px 0 6px}
.score-big .n{font-family:var(--round);font-size:66px;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.score-big .n small{font-size:24px}
.score-big .lbl{font-size:14.5px;font-weight:700;margin-top:6px}
.gauge{height:14px;background:var(--bg);border-radius:8px;overflow:hidden;margin:14px 2px;border:1px solid var(--line)}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#c9a0f0,var(--accent2));border-radius:8px;transition:width 1.1s cubic-bezier(.2,.9,.3,1)}
.vs{display:flex;align-items:flex-start;gap:8px;justify-content:center;margin-bottom:10px}
.vs .mini{flex:1;max-width:130px}
.vs .heart{font-size:26px;align-self:center;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

.ad{background:var(--bg);border:1px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--muted);font-size:12px;margin:16px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.7}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 22px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88vw;text-align:center}
.toast.show{opacity:1}

/* ===== 📱 모바일 최적화 ===== */
@media(max-width:430px){
  .wrap{padding:20px 13px 48px}
  .head h1{font-size:26px}
  .card-ui{padding:19px 16px;border-radius:20px}
  .mbti-grid{gap:6px}
  .mbti-grid button{padding:10px 2px;font-size:12px;border-radius:10px}
  input,select{font-size:16px;padding:12px}            /* 16px: iOS 확대방지 */
  .seg button{font-size:14px;padding:12px}
  .go{font-size:17px;padding:16px}
  .card{max-width:72vw}
  .combohdr .full{font-size:18px}
  .punch,.sec{font-size:13.5px;padding:13px 15px}
  .tools button{min-width:0;flex:1 1 30%;padding:12px 6px;font-size:13px}
  .score-big .n{font-size:54px}
  .vs .mini{max-width:40vw}
}
@media(max-width:340px){
  .mbti-grid button{font-size:11px;padding:9px 1px}
  .statbar .stat b{font-size:16px}
}
</style>

<button class="theme-btn" id="themeBtn" aria-label="테마 전환">◐</button>
<div class="wrap">
  <div class="head"><span class="badge">✨ 무료 사주 뽑기 ✨</span><h1>오행 궁합소</h1><p id="headSub">생일 + MBTI로 내 천간 카드 뽑기 🔮</p></div>

  <div class="card-ui" id="inputCard">
    <div id="friendBn" class="friendbn hidden"></div>
    <label><span class="em">🎂</span>생년월일</label>
    <input id="birth" type="date" min="1930-01-01" max="2025-12-31">
    <label><span class="em">🚻</span>성별</label>
    <div class="seg" id="sexSeg"><button type="button" data-sex="남" aria-pressed="true">남자</button><button type="button" data-sex="여" aria-pressed="false">여자</button></div>
    <label><span class="em">🧬</span>MBTI</label>
    <div class="mbti-grid" id="mbtiGrid"></div>
    <button class="go" id="goBtn">내 카드 뽑기 ✨</button>
  </div>

  <!-- 내 카드 결과 -->
  <div class="result" id="myResult">
    <div id="myCardWrap"></div>
    <div class="combohdr" id="comboHdr"></div>
    <div class="punch" id="myPunch"></div>
    <div class="sec"><b>🧬 MBTI 기질</b><span id="myMbti"></span></div>
    <div class="sec"><b id="starLbl">⭐ 별자리</b><span id="myStar"></span></div>
    <div class="sec"><b>😤 킹받는 순간</b><span id="myRage"></span></div>
    <div class="sec"><b>💕 연애할 때</b><span id="myLove"></span></div>
    <div class="sec sw"><div><b>⚡ 강점</b><span id="myStr"></span></div><div><b>💧 약점</b><span id="myWeak"></span></div></div>
    <div class="sec"><b>🎯 찰떡 직업</b><span id="myJob"></span></div>
    <div class="sec"><b>🍀 2026 운세</b><span id="myYear"></span></div>
    <div class="tools"><button class="primary" id="shareBtn">💌 친구랑 궁합</button><button id="saveBtn">📸 카드 저장</button><button id="redoBtn">다시</button></div>
  </div>

  <!-- 궁합 결과 -->
  <div class="result" id="matchResult">
    <div class="card-ui">
      <div class="vs" id="vsRow"></div>
      <div class="score-big"><div class="n" id="scoreN">0<small>점</small></div><div class="lbl" id="scoreLbl"></div></div>
      <div class="gauge"><i id="gaugeFill" style="width:0"></i></div>
      <div class="punch" id="matchPunch"></div>
    </div>
    <div class="tools"><button class="primary" id="shareBtn2">💌 내 궁합 링크</button><button id="redoBtn2">처음으로</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 일간 계산 (JDN, sxtwl 검증) =====
function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function dayGan(y,m,d){return (jdn(y,m,d)+9)%10;} // 0=甲 ~ 9=癸
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const GAN_KR=['갑','을','병','정','무','기','경','신','임','계'];
const GAN_OH=[0,0,1,1,2,2,3,3,4,4]; // 0목1화2토3금4수
const OH_NAME=['wood','fire','earth','metal','water'];
const OH_KR=['목','화','토','금','수'], OH_EMOJI=['🌳','🔥','⛰️','⚔️','🌊'];

const OH={wood:{bg:'radial-gradient(circle at 50% 35%,#f4fcf5,#daf2e0 70%,#c8ecd1)',rc:'#5aa86e',nc:'#3f8a56'},
 fire:{bg:'radial-gradient(circle at 50% 35%,#fff4f6,#ffdbe4 70%,#ffcad6)',rc:'#e0654a',nc:'#d84a2e'},
 earth:{bg:'radial-gradient(circle at 50% 35%,#fdf8ee,#f5e9d2 70%,#eeddba)',rc:'#c99a3c',nc:'#a87e28'},
 metal:{bg:'radial-gradient(circle at 50% 35%,#faf6fe,#e9def7 70%,#dbcbf0)',rc:'#9b7fd4',nc:'#7b5fc4'},
 water:{bg:'radial-gradient(circle at 50% 35%,#f4faff,#d9ecfa 70%,#c4ddf3)',rc:'#4a8fd4',nc:'#3a7fc4'}};

// 천간 10 데이터 (별명·팩폭·연애·강약점)
const TG=[
 {nick:'고집불통 나무',big:0,punch:'남 밑에 있는 거 진짜 못 견디지? 큰나무는 그늘 밑에선 안 크거든. 속으로 "내가 위에 있어야 하는데" 하고 있잖아 ㅋㅋ',love:'이끌고 챙겨주는 든든한 스타일. 근데 가끔 상대를 "키우려" 들어',str:'추진력·리더십·심지',weak:'고집·자존심·융통성'},
 {nick:'심약초',big:0,punch:'겉으론 다 맞춰주는데 속으론 "이게 나한테 이득인가" 계산하고 있잖아 ㅋㅋ 그거 처세술이지 나쁜 게 아니라.',love:'상대에 맞춰 스며드는 다정형. 근데 아니다 싶으면 조용히 방향 틀어',str:'유연함·적응력·친화력',weak:'우유부단·의존·줏대'},
 {nick:'불꽃 방화범',big:1,punch:'조용히 있어도 티 나는 사람. 네가 방에 들어오면 다들 알아채잖아 ㅋㅋ 근데 그만큼 숨을 곳도 없다는 거.',love:'좋아하면 온 세상이 알게 표현하는 직진형. 근데 식는 것도 빨라',str:'열정·존재감·표현력',weak:'욱함·기복·지속력'},
 {nick:'집착 불강아지',big:0,punch:'세심하게 다 챙기면서 정작 네 마음은 표현 안 하지? 촛불은 조용히 타느라 아무도 뜨거운 줄 몰라 ㅋㅋ',love:'티 안 나게 챙기는 스타일. 한번 켜진 마음은 오래 가는데 은근 집착',str:'섬세·헌신·꾸준함',weak:'예민·속앓이·집착'},

function seed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function build(info){
  const g=dayGan(info.y,info.m,info.d), oh=GAN_OH[g], ohn=OH_NAME[oh], t=TG[g];
  const zi=zodiac(info.m,info.d), z=ZOD[zi];
  const mod=MBTI_MOD[info.mbti]||{adj:'미지의',line:''};
  const s=seed(info.birth+info.mbti);
  let pct=MBTI_PCT[info.mbti]||5; pct=Math.max(1,pct+((s%5)-2)*0.6);
  let grade,gt; if(pct<=3){grade='SSR';gt='초희귀🌟'}else if(pct<=7){grade='SR';gt='희귀💎'}else if(pct<=13){grade='SR';gt='레어✨'}else{grade='R';gt='국민🍀'}
  // 곱하기 풀네임: {MBTI수식어} {천간별명}
  const full=mod.adj+' '+t.nick;
  return {g,oh,ohn,t,gan:GAN[g],ganKR:GAN_KR[g],zi,z,mod,full,mbti:info.mbti,
    rare:grade+'·상위'+Math.round(pct)+'%',
    combo:GAN[g]+OH_KR[oh]+' × '+info.mbti+' × '+z.e+z.n,
    lab:OH_EMOJI[oh]+' '+OH_KR[oh]+'·'+GAN[g]+'·'+info.mbti+'·'+z.n};
}

function ohRel(a,b){if(a===b)return{s:70,r:'같은 기운'};const sh=(a+1)%5===b||(b+1)%5===a;const ke={0:2,2:4,4:1,1:3,3:0};
  if(sh)return{s:92,r:'서로 살려주는 상생'};if(ke[a]===b||ke[b]===a)return{s:48,r:'서로 밀당하는 상극'};return{s:65,r:'무난한 사이'}}
function mbtiSc(a,b){let sm=0;for(let i=0;i<4;i++)if(a[i]===b[i])sm++;let bn=0;if(a[1]===b[1])bn+=8;if(a[2]!==b[2])bn+=6;if(a[0]!==b[0])bn+=4;return Math.min(96,([52,58,64,72,80][sm]||66)+bn)}
// 별자리 원소 궁합 (0불1흙2공기3물)
function elRel(a,b){if(a===b)return{s:80,r:'같은 원소'};
  const tri=(a==0&&b==2)||(a==2&&a!=b&&b==0)||(a==1&&b==3)||(a==3&&b==1); // 불-공기, 흙-물 상생
  if((a==0&&b==2)||(a==2&&b==0)||(a==1&&b==3)||(a==3&&b==1))return{s:90,r:'찰떡 원소'};
  if((a==0&&b==3)||(a==3&&b==0))return{s:52,r:'불vs물'}; // 상극
  if((a==1&&b==2)||(a==2&&b==1))return{s:55,r:'흙vs공기'};
  return{s:66,r:'무난 원소'}}
function compat(A,B){const cA=build(A),cB=build(B);
  const om=ohRel(cA.oh,cB.oh), mm=mbtiSc(A.mbti,B.mbti), em=elRel(cA.z.el,cB.z.el);
  const s=seed(A.birth+A.mbti+'x'+B.birth+B.mbti);
  // 3축 가중: 오행 40 + MBTI 35 + 별자리 25
  let sc=Math.round(om.s*0.40+mm*0.35+em.s*0.25);
  sc=Math.max(41,Math.min(99,sc+(s%7)-3));return{sc,om,mm,em,cA,cB}}
function matchLine(sc,om){if(sc>=90)return '천생연분 🔥 '+om.r+'이라 만나면 시너지 폭발. 이 조합 놓치면 손해ㅋㅋ';
  if(sc>=75)return '꽤 잘 맞아 💫 '+om.r+'. 티격태격해도 결국 붙어있을 케미';
  if(sc>=60)return '나쁘지 않아 🙂 '+om.r+'이라 노력하면 좋아지는 사이';
  if(sc>=50)return '밀당의 정석 ⚡ '+om.r+'. 은근 중독되는 조합';
  return '극과 극 🌗 '+om.r+'이라 이해엔 노력 필요. 근데 그래서 안 질려'}

$('mbtiGrid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mbti=b.dataset.m;[...$('mbtiGrid').children].forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('sexSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sex=b.dataset.sex;[...$('sexSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b))});
try{const sv=JSON.parse(localStorage.getItem('gh-me')||'null');if(sv){$('birth').value=sv.birth;sex=sv.sex;mbti=sv.mbti;[...$('sexSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.sex===sex));setTimeout(()=>[...$('mbtiGrid').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===mbti)),0)}}catch(e){}
function readInput(){const b=$('birth').value;if(!b){toast('생년월일을 골라줘');return null}if(!mbti){toast('MBTI를 골라줘');return null}const[y,m,d]=b.split('-').map(Number);return{birth:b,y,m,d,sex,mbti}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}

function showMy(info){
  myInfo=info;try{localStorage.setItem('gh-me',JSON.stringify(info))}catch(e){}
  const c=build(info);
  $('myCardWrap').innerHTML=cardHTML(c)+statBar(c.g)+tagRow(c.g)+`<div class="clab">${c.lab}</div>`;
  $('comboHdr').innerHTML=`<div class="full">🎴 "${c.full}"</div><div class="combo">${c.combo}</div>`;
  $('myPunch').innerHTML='💥 '+c.t.punch;
  $('myMbti').innerHTML=`<b style="color:var(--fg)">${c.mod.adj}</b> — ${c.mod.line}`;
  $('starLbl').textContent=`${c.z.e} ${c.z.n} (${EL_KR[c.z.el]})`;
  $('myStar').textContent=c.z.line;
  $('myRage').textContent=RAGE[c.g];
  $('myLove').textContent=c.t.love;$('myStr').textContent=c.t.str;$('myWeak').textContent=c.t.weak;
  $('myJob').textContent=JOB[c.g];$('myYear').textContent=YEAR[c.g];
  $('inputCard').classList.add('hidden');$('myResult').classList.add('show');$('matchResult').classList.remove('show');
  window.scrollTo({top:0,behavior:'smooth'});
}
function showMatch(A,B){
  const r=compat(A,B);
  $('vsRow').innerHTML=`<div class="mini">${cardHTML(r.cA,1)}</div><div class="heart">💗</div><div class="mini">${cardHTML(r.cB,1)}</div>`;
  $('scoreN').innerHTML=r.sc+'<small>점</small>';
  $('scoreLbl').textContent=r.sc>=85?'천생연분급 💖':r.sc>=70?'꽤 잘 맞음 💫':r.sc>=55?'노력하면 굿 🙂':'극과극 매력 🌗';
  const bar=v=>v>=85?'🟢':v>=65?'🟡':'🔴';
  $('matchPunch').innerHTML='💘 '+matchLine(r.sc,r.om)
    +`<div class="axis">${bar(r.om.s)} <b>오행</b> ${r.om.r} · ${bar(r.mm)} <b>MBTI</b> ${r.mm>=75?'찰떡':r.mm>=60?'무난':'상극매력'} · ${bar(r.em.s)} <b>별자리</b> ${r.em.r}</div>`;
  setTimeout(()=>$('gaugeFill').style.width=r.sc+'%',100);
  $('inputCard').classList.add('hidden');$('myResult').classList.remove('show');$('matchResult').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}
function enc(i){return btoa(unescape(encodeURIComponent(JSON.stringify({b:i.birth,s:i.sex,m:i.mbti}))))}
function dec(str){try{const o=JSON.parse(decodeURIComponent(escape(atob(str))));const[y,m,d]=o.b.split('-').map(Number);return{birth:o.b,y,m,d,sex:o.s,mbti:o.m}}catch(e){return null}}
async function doShare(info){const link=location.origin+location.pathname+'?c='+enc(info);try{await navigator.clipboard.writeText(link);toast('링크 복사됨! 친구한테 붙여넣기 📋')}catch(e){prompt('이 링크를 복사해서 친구한테:',link)}}

// 카드 이미지 저장
$('saveBtn').onclick=async()=>{
  const el=$('myCardWrap').querySelector('.card');if(!el)return;
  toast('카드 이미지 만드는 중...');
  try{
    const canvas=await html2canvas(el,{backgroundColor:null,scale:2,useCORS:true});
    canvas.toBlob(b=>{
      const url=URL.createObjectURL(b);
      const a=document.createElement('a');a.href=url;a.download='내오행카드.png';a.click();
      setTimeout(()=>URL.revokeObjectURL(url),3000);
      toast('저장됐어! (안 되면 카드 길게 눌러 저장)');
    });
  }catch(e){toast('이 화면에선 저장이 막혔어. 배포 후엔 정상 동작해')}
};

$('goBtn').onclick=()=>{const i=readInput();if(i)showMy(i)};
$('redoBtn').onclick=()=>{$('myResult').classList.remove('show');$('inputCard').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
$('redoBtn2').onclick=()=>location.href=location.origin+location.pathname;
$('shareBtn').onclick=()=>{if(myInfo)doShare(myInfo)};$('shareBtn2').onclick=()=>{if(myInfo)doShare(myInfo)};

(function(){const p=new URLSearchParams(location.search).get('c');if(p){friendInfo=dec(p);if(friendInfo){const fc=build(friendInfo);
  $('friendBn').classList.remove('hidden');$('friendBn').innerHTML=`${OH_EMOJI[fc.oh]} <b>${fc.t.nick}</b> 님이 궁합을 신청했어요!<br>네 정보 넣으면 <b>천생연분 점수</b>가 나와 💘`;
  $('headSub').textContent='친구와의 궁합을 확인해봐 💘';$('goBtn').textContent='궁합 점수 보기 💘';
  $('goBtn').onclick=()=>{const i=readInput();if(i){myInfo=i;try{localStorage.setItem('gh-me',JSON.stringify(i))}catch(e){}showMatch(friendInfo,i)}}
}}})();
</script>
